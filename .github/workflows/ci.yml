name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Mondays: advisories published since the last push still fail the build.
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Run from the official image, pinned by digest (no third-party action code).
  TRIVY: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  build:
    name: Type-check, lint and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # PageProps and LayoutProps are generated by Next.js; a fresh checkout has none.
      - name: Type-check
        run: npx next typegen && npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  trivy:
    name: Trivy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # findings in the repository's Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan the repository (dependencies, secrets, Dockerfile)
        run: >-
          docker run --rm -v "$PWD:/src" -w /src -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY"
          fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed
          --exit-code 1 .
      - name: Build the dashboard image
        run: docker build -t vpspilot/web:ci .
      - name: Scan the image (OS packages and Node.js packages)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY"
          image --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed
          --exit-code 1 vpspilot/web:ci
      # Everything with a fix, any severity (unfixable distro issues would only be noise).
      - name: Full reports for the Security tab
        if: ${{ !cancelled() }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY" \
            fs --scanners vuln,secret,misconfig --ignore-unfixed --format sarif --output trivy-repo.sarif .
          docker run --rm -v "$PWD:/src" -w /src -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY" \
            image --scanners vuln,secret --ignore-unfixed --format sarif --output trivy-image.sarif vpspilot/web:ci
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: ${{ !cancelled() && hashFiles('trivy-repo.sarif') != '' }}
        with:
          sarif_file: trivy-repo.sarif
          category: trivy-repository
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: ${{ !cancelled() && hashFiles('trivy-image.sarif') != '' }}
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
