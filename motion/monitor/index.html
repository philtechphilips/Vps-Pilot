<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"theme","type":"enum","label":"Theme","default":"light","options":[{"value":"light","label":"Light"},{"value":"dark","label":"Dark"}]}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1000, height=880" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MorphSVGPlugin.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js"></script>
    <link rel="stylesheet" href="assets/clip.css" />
    <style>
      @font-face {
        font-family: "Geist";
        src: url("assets/fonts/Geist.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Geist Mono";
        src: url("assets/fonts/GeistMono.woff2") format("woff2");
        font-weight: 100 900;
      }
      html,
      body {
        width: 1000px;
        height: 880px;
        overflow: hidden;
      }
      #m-card {
        left: 50px;
        top: 54px;
        width: 400px;
        height: 244px;
        z-index: 1;
      }
      .m-head {
        position: absolute;
        left: 20px;
        right: 20px;
        top: 20px;
        justify-content: space-between;
        font-size: 13px;
      }
      .m-title {
        font-weight: 600;
      }
      .m-range {
        font-size: 11px;
        color: var(--subtle);
      }
      #m-chart {
        position: absolute;
        left: 20px;
        top: 52px;
        width: 360px;
        height: 120px;
        overflow: visible;
      }
      #m-limit-label {
        position: absolute;
        left: 20px;
        top: 66px;
        font-size: 10px;
        color: var(--warn-text);
      }
      .m-stats {
        position: absolute;
        left: 20px;
        right: 20px;
        top: 186px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        padding-top: 14px;
        border-top: 1px solid var(--line);
        font-size: 11px;
      }
      .m-stats .k {
        color: var(--subtle);
      }
      .m-stats .v {
        margin-top: 2px;
        font-size: 15px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      #m-alert {
        left: 24px;
        top: 300px;
        width: 280px;
        height: 60px;
        z-index: 2;
      }
      #m-alert .surface {
        border-radius: 14px;
      }
      .m-alert-body {
        position: absolute;
        inset: 0;
        padding: 0 14px;
        gap: 12px;
      }
      .m-bell {
        width: 32px;
        height: 32px;
        flex: none;
        border-radius: 50%;
        background: color-mix(in srgb, var(--warn) 14%, transparent);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .m-bell svg {
        width: 16px;
        height: 16px;
        overflow: visible;
      }
      .m-alert-title {
        font-size: 12px;
        font-weight: 500;
      }
      .m-channels {
        margin-top: 4px;
        gap: 5px;
        font-size: 10px;
        color: var(--muted);
      }
      .m-chip {
        display: inline-flex;
        align-items: center;
        height: 17px;
        padding: 0 7px;
        border-radius: 9px;
        background: var(--tint);
      }
      #m-alert .tint {
        background: var(--warn);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="monitor" data-start="0" data-duration="6.4" data-width="1000" data-height="880">
      <div id="m-scene" class="clip" data-start="0" data-duration="6.4" data-track-index="0">
        <div class="stage" style="width: 500px; height: 440px; transform: scale(2)">
          <div id="m-card" class="lift">
            <div class="surface">
              <div class="m-head row m-in">
                <span class="m-title">web-2 · Disk</span>
                <span class="m-range">Last hour</span>
              </div>
              <svg id="m-chart" viewBox="0 0 360 120">
                <defs>
                  <linearGradient id="m-fill" x1="0" x2="0" y1="0" y2="1">
                    <stop offset="0" stop-color="var(--accent)" stop-opacity="0.16" />
                    <stop offset="1" stop-color="var(--accent)" stop-opacity="0" />
                  </linearGradient>
                </defs>
                <line id="m-limit" x1="0" x2="360" y1="30" y2="30" stroke="var(--warn)" stroke-width="1" stroke-dasharray="3 4" />
                <path id="m-area" fill="url(#m-fill)" />
                <path id="m-line" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                <circle id="m-dot" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" />
              </svg>
              <span id="m-limit-label">85% limit</span>
              <div class="m-stats m-in">
                <div><p class="k">CPU</p><p class="v" id="m-cpu">0%</p></div>
                <div><p class="k">Memory</p><p class="v" id="m-mem">0%</p></div>
                <div><p class="k">Disk</p><p class="v" id="m-disk">0%</p></div>
              </div>
            </div>
          </div>

          <!-- The dot on the chart flies out and becomes this alert. -->
          <div id="m-alert" class="lift">
            <div id="m-alert-surface" class="surface">
              <div class="m-alert-body row">
                <span class="m-bell">
                  <svg viewBox="0 0 24 24"><path id="m-bell-path" d="M12 8.5a3.5 3.5 0 1 1 0 7a3.5 3.5 0 1 1 0-7" fill="none" stroke="var(--warn)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
                </span>
                <div>
                  <p class="m-alert-title a-in">Disk above 85% on web-2</p>
                  <div class="m-channels row">
                    <span class="a-in">Sent to</span>
                    <span class="m-chip a-chip">Telegram</span>
                    <span class="m-chip a-chip">Email</span>
                  </div>
                </div>
              </div>
              <div id="m-alert-tint" class="tint"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="assets/motion.js"></script>
    <script>
      applyTheme();
      const css = getComputedStyle(document.getElementById("root"));
      const WARN = css.getPropertyValue("--warn").trim();
      const WARN_TEXT = css.getPropertyValue("--warn-text").trim();
      const BELL = "M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0";

      // Disk use over the last hour, drawn as a smooth curve (Catmull-Rom).
      const values = [52, 55, 53, 58, 57, 61, 60, 66, 64, 70, 69, 75, 74, 81, 88];
      const pts = values.map((v, i) => [(i * 360) / (values.length - 1), 120 * (1 - (v - 40) / 60)]);
      let d = `M${pts[0][0]},${pts[0][1]}`;
      for (let i = 0; i < pts.length - 1; i++) {
        const [p0, p1, p2, p3] = [pts[Math.max(0, i - 1)], pts[i], pts[i + 1], pts[Math.min(pts.length - 1, i + 2)]];
        const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
        const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
        d += ` C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${p2[0]},${p2[1]}`;
      }
      const line = document.getElementById("m-line");
      line.setAttribute("d", d);
      document.getElementById("m-area").setAttribute("d", `${d} L360,120 L0,120 Z`);
      const length = line.getTotalLength();

      const alert = document.getElementById("m-alert-surface");
      const tl = gsap.timeline({ paused: true });

      gsap.set(".m-in, .a-in, .a-chip, #m-limit-label, #m-alert", { opacity: 0 });
      gsap.set(line, { strokeDasharray: length, strokeDashoffset: length });
      gsap.set("#m-area", { clipPath: "inset(0px 100% 0px 0px)" });
      gsap.set("#m-limit", { scaleX: 0, svgOrigin: "0 30" });
      gsap.set(alert, { clipPath: shape(alert, { x: 22, y: 22, w: 16, h: 16 }, 8) });
      // The alert starts with its icon sitting on the chart's last point.
      gsap.set("#m-alert", { x: 376, y: -200 });

      // 1. The card rises in on a spring.
      tl.fromTo("#m-card", { y: 28, opacity: 0 }, { y: 0, duration: 1, ease: SPRING }, 0.1);
      tl.to("#m-card", { opacity: 1, duration: 0.35, ease: "arrive" }, 0.1);
      blurIn(tl, ".m-in", 0.4, { stagger: 0.08 });

      // 2. The line draws in; the dot rides its tip; the fill follows.
      const draw = { duration: 2, ease: "glide" };
      tl.to(line, { strokeDashoffset: 0, ...draw }, 0.7);
      tl.to("#m-area", { clipPath: "inset(0px 0% 0px 0px)", ...draw }, 0.7);
      tl.fromTo("#m-dot", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "glide" }, 0.7);
      tl.to("#m-dot", { motionPath: { path: line, align: line, alignOrigin: [0.5, 0.5] }, ...draw }, 0.7);
      tl.to("#m-limit", { scaleX: 1, duration: 0.8, ease: "glide" }, 0.95);
      blurIn(tl, "#m-limit-label", 1.4, { duration: 0.35 });
      countUp(tl, document.getElementById("m-cpu"), 64, 0.9, 1.6, (v) => `${Math.round(v)}%`);
      countUp(tl, document.getElementById("m-mem"), 71, 0.98, 1.6, (v) => `${Math.round(v)}%`);
      countUp(tl, document.getElementById("m-disk"), 86, 1.06, 1.64, (v) => `${Math.round(v)}%`);

      // 3. Crossing 85%: the dot and the disk figure turn amber.
      tl.to("#m-dot", { fill: WARN, duration: 0.25, ease: "glide" }, 2.5);
      tl.to("#m-dot", { scale: 1.45, transformOrigin: "50% 50%", duration: 0.5, ease: BOUNCE }, 2.55);
      tl.to("#m-disk", { color: WARN_TEXT, duration: 0.3, ease: "glide" }, 2.5);

      // 4. A stillness, then the dot flies off the chart and grows into the alert.
      tl.to("#m-alert", { opacity: 1, duration: 0.01 }, 3.05);
      tl.to("#m-dot", { opacity: 0, duration: 0.01 }, 3.05);
      tl.to("#m-alert", { x: 0, duration: 0.85, ease: "glide" }, 3.05);
      tl.to("#m-alert", { y: 0, duration: 0.85, ease: "arrive" }, 3.05);
      tl.to(alert, { clipPath: full(14), duration: 0.7, ease: "arrive" }, 3.3);
      tl.to("#m-alert-tint", { opacity: 0, duration: 0.45, ease: "glide" }, 3.4);

      // 5. The circle inside morphs into a bell; the message and channels land.
      tl.to("#m-bell-path", { morphSVG: BELL, duration: 0.5, ease: "arrive" }, 3.7);
      tl.fromTo(".m-bell svg", { rotation: -14, transformOrigin: "50% 10%" }, { rotation: 0, duration: 0.9, ease: BOUNCE }, 3.95);
      blurIn(tl, ".a-in", 3.85, { stagger: 0.1 });
      tl.fromTo(".a-chip", { scale: 0.6, opacity: 0 }, { scale: 1, duration: 0.6, stagger: 0.08, ease: BOUNCE }, 4.15);
      tl.to(".a-chip", { opacity: 1, duration: 0.25, stagger: 0.08, ease: "glide" }, 4.15);

      window.__timelines["monitor"] = tl;
    </script>
  </body>
</html>
